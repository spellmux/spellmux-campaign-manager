services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: campaign
      POSTGRES_USER: campaign
      POSTGRES_PASSWORD: ${CAMPAIGN_DATABASE_PASSWORD:?set CAMPAIGN_DATABASE_PASSWORD}
    volumes:
      - campaign-database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campaign -d campaign"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: .
    restart: unless-stopped
    environment: &campaign-environment
      CAMPAIGN_ENV: ${CAMPAIGN_ENV:-production}
      CAMPAIGN_HOST: 0.0.0.0
      CAMPAIGN_PORT: 8088
      CAMPAIGN_DATABASE_URL: postgresql+psycopg://campaign:${CAMPAIGN_DATABASE_PASSWORD}@database:5432/campaign
      CAMPAIGN_ARTIFACT_ROOT: /data/artifacts
      CAMPAIGN_PUBLISH_ROOT: /data/publish
      CAMPAIGN_LOG_LEVEL: ${CAMPAIGN_LOG_LEVEL:-INFO}
      CAMPAIGN_ANALYSIS_PROVIDER: ${CAMPAIGN_ANALYSIS_PROVIDER:-disabled}
      CAMPAIGN_ANALYSIS_MODEL: ${CAMPAIGN_ANALYSIS_MODEL:-qwen3:4b}
      CAMPAIGN_ANALYSIS_BASE_URL: ${CAMPAIGN_ANALYSIS_BASE_URL:-http://ollama:11434}
    ports:
      - "${CAMPAIGN_HTTP_PORT:-8088}:8088"
    volumes:
      - ${CAMPAIGN_ARTIFACT_PATH:-./data/artifacts}:/data/artifacts
      - ${CAMPAIGN_PUBLISH_PATH:-./data/publish}:/data/publish
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8088/api/v1/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    restart: unless-stopped
    command: ["campaign-worker"]
    environment: *campaign-environment
    volumes:
      - ${CAMPAIGN_ARTIFACT_PATH:-./data/artifacts}:/data/artifacts
      - ${CAMPAIGN_PUBLISH_PATH:-./data/publish}:/data/publish
    depends_on:
      database:
        condition: service_healthy

  diarization-worker:
    build:
      context: .
      target: diarization-worker
    restart: unless-stopped
    command: ["campaign-worker"]
    environment:
      <<: *campaign-environment
      CAMPAIGN_TRANSCRIPTION_PROVIDER: disabled
      CAMPAIGN_DIARIZATION_PROVIDER: pyannote
      CAMPAIGN_DIARIZATION_MODEL: pyannote/speaker-diarization-community-1
      CAMPAIGN_DIARIZATION_DEVICE: cpu
      CAMPAIGN_ANALYSIS_PROVIDER: disabled
      CAMPAIGN_HUGGINGFACE_TOKEN: ${CAMPAIGN_HUGGINGFACE_TOKEN:-}
      CAMPAIGN_MODEL_ROOT: /data/models
    volumes:
      - ${CAMPAIGN_ARTIFACT_PATH:-./data/artifacts}:/data/artifacts
      - ${CAMPAIGN_MODEL_PATH:-./data/models}:/data/models
    depends_on:
      database:
        condition: service_healthy

volumes:
  campaign-database:
